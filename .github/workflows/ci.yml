name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v

  changelog:
    name: Update changelog
    runs-on: ubuntu-latest
    # Only on pushes to main by humans; skip when the bot itself pushes the changelog back.
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
          cache-dependency-glob: uv.lock

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Skip when this commit is a release tag
        id: guard
        run: |
          # The Release workflow regenerates and pushes CHANGELOG.md for tagged
          # commits. Running both races on `git push origin main`.
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate CHANGELOG.md
        if: steps.guard.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run git-cliff --output CHANGELOG.md

      - name: Commit if changed
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(changelog): update unreleased section [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

  summary:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        env:
          RESULT: ${{ needs.test.result }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "## CI — $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`$EVENT\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`$REF\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${SHA:0:7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Python versions** | \`3.9\`, \`3.10\`, \`3.11\`, \`3.12\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$RESULT" = "success" ]; then
            echo "### ✅ All checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ One or more checks failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See [matrix results]($RUN_URL) for per-version details." >> $GITHUB_STEP_SUMMARY
          fi

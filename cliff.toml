# git-cliff configuration — https://git-cliff.org/docs/configuration
# Conventional Commits spec: https://www.conventionalcommits.org

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Generated by [git-cliff](https://github.com/orhun/git-cliff).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/Xieyt/typer-examples/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
# Only include conventional commits; skip "first commit" and any free-form messages.
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_preprocessors = [
  # Turn GitHub issue references (#N) into links.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/Xieyt/typer-examples/issues/${2}))" },
]

commit_parsers = [
  { message = "^feat",     group = "Features"         },
  { message = "^fix",      group = "Bug Fixes"        },
  { message = "^docs?",    group = "Documentation"    },
  { message = "^perf",     group = "Performance"      },
  { message = "^refactor", group = "Refactoring"      },
  { message = "^test",     group = "Tests"            },
  { message = "^ci",       group = "CI/CD"            },
  { message = "^build",    group = "Build"            },
  { message = "^chore",    group = "Miscellaneous"    },
  { message = "^revert",   group = "Reverts"          },
  { message = "^style",    group = "Styling"          },
  { skip = true, message = "^Merge" },
]

protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

# git-cliff configuration — https://git-cliff.org/docs/configuration
# Conventional Commits spec: https://www.conventionalcommits.org

[remote.github]
owner = "Xieyt"
repo  = "typer-examples"

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Generated by [git-cliff](https://github.com/orhun/git-cliff).

"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{%- macro print_commit(commit) -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} \
([`{{ commit.id | truncate(length=7, end="") }}`]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% if commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){% endif %}\
{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% endif %}
{%- endmacro -%}

{% if version %}\
{% if previous.version %}\
## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}\
{% else %}\
## [Unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}{{ self::print_commit(commit=commit) }}
{% endfor %}
{% endfor %}\

{%- if github -%}
{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
## New Contributors ❤️

{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) -%}
- [@{{ contributor.username }}](https://github.com/{{ contributor.username }}) made their first contribution\
{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}
{% endfor %}
{%- endif -%}
{%- endif %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_preprocessors = [
  # Turn GitHub issue references (#N) into links.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/Xieyt/typer-examples/issues/${2}))" },
]

commit_parsers = [
  # Skip bot-generated changelog commits.
  { message = "^chore\\(changelog\\)", skip = true },
  # Skip version-bump commits.
  { message = "^chore.*bump version", skip = true },
  { message = "^feat",     group = "<!-- 0 -->✨ Features"       },
  { message = "^fix",      group = "<!-- 1 -->🐛 Bug Fixes"      },
  { message = "^docs?",    group = "<!-- 2 -->📚 Documentation"  },
  { message = "^perf",     group = "<!-- 3 -->⚡ Performance"    },
  { message = "^refactor", group = "<!-- 4 -->🚜 Refactoring"   },
  { message = "^test",     group = "<!-- 5 -->🧪 Tests"          },
  { message = "^ci",       group = "<!-- 6 -->⚙️  CI/CD"          },
  { message = "^build",    group = "<!-- 7 -->🏗️  Build"          },
  { message = "^chore",    group = "<!-- 8 -->📦 Miscellaneous"  },
  { message = "^revert",   group = "<!-- 9 -->◀️  Reverts"        },
  { message = "^style",    group = "<!-- 10 -->🎨 Styling"       },
  { skip = true, message = "^Merge" },
]

protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
